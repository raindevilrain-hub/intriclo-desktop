services:
  claude-supervisor:
    build: .
    container_name: claude-nas-supervisor
    restart: unless-stopped
    environment:
      HOME: ${CLAUDE_HOME}
      CHECK_INTERVAL: '300'
      STAGGER_SECONDS: '20'
    volumes:
      # 호스트의 실제 ~/.claude를 컨테이너 안에도 "완전히 같은 경로"로 그대로
      # 마운트한다 — 옮기지 않는다. Claude Code는 세션이 어느 프로젝트
      # 것인지 실제 작업 경로 문자열 자체로 구분하므로(폴더 이름 = 경로의
      # "/"를 "-"로 바꾼 것), 컨테이너 안에서 경로가 달라지면 슈퍼바이저가
      # 이미 있는 세션을 못 찾고 자격증명도 안 먹힌다.
      - ${CLAUDE_HOME}/.claude:${CLAUDE_HOME}/.claude
      # claude-sessions.conf에 적은 프로젝트들이 실제로 들어있는 공통 상위
      # 경로. 프로젝트가 여러 상위 경로에 흩어져 있으면 이런 줄을 그만큼
      # 더 추가한다(예: - /volume2/projects:/volume2/projects).
      - ${PROJECTS_ROOT}:${PROJECTS_ROOT}
      - ./claude-sessions.conf:/app/claude-sessions.conf:ro
      - ./logs:/data/logs
